name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            builder_args: --win
          - os: ubuntu-latest
            platform: linux
            builder_args: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 || sudo apt-get install -y fuse libfuse2t64

      - name: Verify Tag Matches package.json Version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = "${{ github.ref_name }}"
          $expectedTag = "v$($pkg.version)"
          Write-Host "Checking tag '$tag' against expected tag '$expectedTag'..."
          if ($tag -ne $expectedTag) {
            Write-Error "Release tag '$tag' does not match package.json version 'v$($pkg.version)'"
            exit 1
          }
          Write-Host "Version validation successful: $tag"

      - name: Verify Tag Matches package.json Version (Linux)
        if: runner.os == 'Linux'
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          tag="${{ github.ref_name }}"
          expected="v${pkg_ver}"
          echo "Checking tag '$tag' against expected tag '$expected'..."
          if [ "$tag" != "$expected" ]; then
            echo "Release tag '$tag' does not match package.json version '$expected'"
            exit 1
          fi
          echo "Version validation successful: $tag"

      - name: Unit Tests
        run: npx vitest run

      - name: Check Brand Integrity
        run: npm run check:brand

      - name: Build Web Assets
        env:
          BEACON_TELEMETRY_URL: ${{ vars.BEACON_TELEMETRY_URL }}
        run: npm run build

      - name: Build and Publish Electron Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEACON_TELEMETRY_URL: ${{ vars.BEACON_TELEMETRY_URL }}
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
